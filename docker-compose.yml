# Local development. Production does not include the Firestore emulator.
services:
  firestore:
    image: google/cloud-sdk:522.0.0-emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080", "--project=astromedica-local"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      FRONTEND_URL: http://localhost:8000
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
      CLERK_AUTHORIZED_PARTIES: http://localhost:8000
      FIRESTORE_PROJECT_ID: astromedica-local
      FIRESTORE_EMULATOR_HOST: firestore:8080
      PORT: "8000"
    depends_on:
      firestore:
        condition: service_healthy
    volumes:
      - patient_data:/app/patients
      - chart_cache:/app/charts_cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  patient_data:
  chart_cache:
