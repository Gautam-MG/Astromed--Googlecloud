# Production compose for the Compute Engine VM.
# Secrets are supplied by the environment or Secret Manager, not by this file.
services:
  api:
    image: ${APP_IMAGE:-astromedica-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8000"
      TRUST_CLOUDFLARE: "true"
      TRUST_PROXY: "true"
    volumes:
      - patient_data:/app/patients
      - chart_cache:/app/charts_cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

volumes:
  patient_data:
  chart_cache:
