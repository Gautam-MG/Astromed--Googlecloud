# =======================================================================
# AMEYA INNOVATIONS - CONTINUOUS INTEGRATION PIPELINE
# This workflow automates code security, library building, and Docker testing.
# =======================================================================
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =======================================================================
  # JOB 1: Rapid Code Security Verification (Gitleaks via Docker Container)
  # =======================================================================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls the full history required for an authentic secret tracking scan

      # Runs the open-source scanner engine safely within an isolated, local container context.
      # This removes download commands, file extractions, or organization license locks entirely.
      - name: Run Open-Source Gitleaks Container Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace zricethezav/gitleaks:latest detect --source=/workspace --verbose --log-opts="-1"

  # =======================================================================
  # JOB 2: Automated Testing Suite & Validation
  # =======================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches standard pip packages to save compute minutes

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r astrohealth-app-main/requirements-dev.txt

      - name: Run tests
        working-directory: astrohealth-app-main
        env:
          APP_ENV: test
        run: python -m pytest -q

  # =======================================================================
  # JOB 3: Production Docker Build & Layer Verification
  # =======================================================================
  docker-build-scan:
    needs: [test, gitleaks] # Keeps the deployment blocked if security steps fail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: astrohealth-backend:${{ github.sha }}
          push: false
          cache-from: type=gha 
          cache-to: type=gha,mode=max
